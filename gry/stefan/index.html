<!doctype html>
<!-- stefan — gra zrobiona w Kodacy Studio. Stronę składa Studio
     (server/publikacja.js) przy „🌐 Wyślij do sieci”; ręczne zmiany znikną
     przy następnej wysyłce. -->
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>stefan — Kodacy</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="stefan">
  <meta property="og:description" content="Gra zrobiona w Kodacy Studio. Kliknij i zagraj w przeglądarce!">
  <meta property="og:image" content="https://stasnowak.github.io/kodacy/gry/stefan/okladka.png">
  <meta property="og:url" content="https://stasnowak.github.io/kodacy/gry/stefan/">
  <link rel="icon" href="https://stasnowak.github.io/kodacy/gry/stefan/okladka.png">
  <!-- Player love.js jest jeden na całą stronę (../../player/) i szuka swoich
       plików (11.5/love.js, 11.5/love.wasm, lua/*.lua) względem adresu
       strony, stąd <base>. Adresy tej gry są więc zawsze pełne (https://stasnowak.github.io/kodacy/gry/stefan/). -->
  <base href="../../player/">
  <link rel="stylesheet" href="style.css">
  <style>
    :root { --tlo: #14121c; --tekst: #f4f1ff; --przygaszony: #a9a3c2; --akcent: #ffcc33; --przycisk: #2c2840; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--tlo); color: var(--tekst);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none;
    }
    header { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 960px; padding: 8px 16px; box-sizing: border-box; }
    h1 { font-size: 20px; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    header a { color: var(--przygaszony); font-size: 14px; text-decoration: none; white-space: nowrap; }
    #pelny { background: var(--przycisk); color: var(--tekst); border: 0; border-radius: 8px; font-size: 18px; min-width: 44px; min-height: 44px; cursor: pointer; }
    /* ekran gry: zawsze 4:3 (gra ma 640×480), jak największy */
    .ekran {
      position: relative; flex: 0 0 auto;
      width: min(100vw, calc((100vh - 170px) * 4 / 3)); aspect-ratio: 4 / 3;
      background: #000;
    }
    @supports (height: 100dvh) {
      .ekran { width: min(100vw, calc((100dvh - 170px) * 4 / 3)); }
    }
    #canvas {
      position: absolute !important; inset: 0; width: 100% !important; height: 100% !important;
      object-fit: contain !important; image-rendering: pixelated; background: #000; outline: none;
    }
    #spinner { z-index: 5; }
    #start {
      position: absolute; inset: 0; z-index: 10; border: 0; padding: 0; cursor: pointer;
      background: #000 center / contain no-repeat; image-rendering: pixelated;
      display: flex; align-items: center; justify-content: center;
    }
    #start span {
      background: var(--akcent); color: #1b1630; font-weight: 800; font-size: clamp(22px, 5vw, 36px);
      padding: 14px 32px; border-radius: 999px; box-shadow: 0 6px 0 #b8860b;
    }
    #start:hover span { transform: translateY(-2px); }
    #start[hidden] { display: none; }
    .sterowanie { color: var(--przygaszony); margin: 8px 16px; text-align: center; font-size: 14px; }
    /* ekranowe przyciski: tylko na ekranach dotykowych */
    .pad { display: none; gap: 12px; padding: 4px 16px 16px; justify-content: center; }
    .pad button {
      min-width: 64px; min-height: 64px; font-size: 28px; border-radius: 16px; border: 0;
      background: var(--przycisk); color: var(--tekst); touch-action: none;
    }
    .pad button.wcisniety { background: var(--akcent); }
    .pad .odstep { width: 24px; }
    @media (pointer: coarse) { .pad { display: flex; } }
  </style>
</head>
<body>
  <header>
    <h1>stefan</h1>
    <a href="https://stasnowak.github.io/kodacy/">🎮 Więcej gier</a>
    <button type="button" id="pelny" title="Pełny ekran">⛶</button>
  </header>
  <main class="ekran">
    <canvas id="canvas" tabindex="0"></canvas>
    <div id="spinner"></div>
    <button type="button" id="start" style="background-image: url('https://stasnowak.github.io/kodacy/gry/stefan/okladka.png')"><span>▶ Graj</span></button>
  </main>
  <p class="sterowanie">⬅️ ➡️ biegasz, ⬆️ albo spacja: skok, X: akcja (B)</p>
  <div class="pad">
    <button type="button" data-klawisz="left" aria-label="w lewo">⬅️</button>
    <button type="button" data-klawisz="up" aria-label="skok">⬆️</button>
    <button type="button" data-klawisz="right" aria-label="w prawo">➡️</button>
    <span class="odstep"></span>
    <button type="button" data-klawisz="x" aria-label="przycisk B">🅱️</button>
  </div>
  <script>
    // Escape w przeglądarce nic nie robi: w grze na konsoli kończy grę, a tu
    // zostawiłby czarny ekran. Łapiemy go, zanim dojdzie do silnika.
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') e.stopImmediatePropagation();
    }, true);
  </script>
  <!-- mostek klawiszy (ten sam co w Studiu) i player; g=norun: sam nie startuje -->
  <script src="mostek.js"></script>
  <script src="player.js?g=norun"></script>
  <script>
    (function () {
      var GRA = 'https://stasnowak.github.io/kodacy/gry/stefan/game.love?v=1790169092000';
      var PACZKA = 'stefan.love';
      var start = document.getElementById('start');
      var spinner = document.getElementById('spinner');
      var canvas = document.getElementById('canvas');
      spinner.className = '';

      // LÖVE ustawia tytuł karty z conf.lua (nazwa szablonu); zostawiamy nazwę gry
      var tytul = document.title;
      new MutationObserver(function () {
        if (document.title !== tytul) document.title = tytul;
      }).observe(document.querySelector('title'), { childList: true, characterData: true, subtree: true });

      // Paczkę gry pobieramy sami, zawsze świeżą (?v= to wersja ze Studia):
      // player zapamiętuje paczki w IndexedDB i sam dałby znajomym starą grę.
      // Silnik (love.wasm, 5 MB) zostaje w pamięci przeglądarki, więc drugi
      // raz strona startuje od razu.
      start.addEventListener('click', function () {
        start.hidden = true;
        spinner.className = 'loading';
        fetch(GRA, { cache: 'no-store' })
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.arrayBuffer();
          })
          .then(function (buf) { return Player.storePkg(PACZKA, new Uint8Array(buf)); })
          .then(function () {
            Player.start(PACZKA, []);
            canvas.focus();
          })
          .catch(function (err) {
            console.error('Nie udało się pobrać gry:', err);
            spinner.className = 'error';
          });
      });

      document.getElementById('pelny').addEventListener('click', function () {
        var el = document.documentElement;
        if (document.fullscreenElement) document.exitFullscreen();
        else if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
        else if (canvas.webkitRequestFullscreen) canvas.webkitRequestFullscreen();
      });

      // ekranowe przyciski: ten sam kanał co klawiatura (mostek.js)
      Array.prototype.forEach.call(document.querySelectorAll('.pad button'), function (btn) {
        var k = btn.getAttribute('data-klawisz');
        function wcisnij(e) {
          e.preventDefault();
          try { btn.setPointerCapture(e.pointerId); } catch (err) { /* stara przeglądarka */ }
          btn.classList.add('wcisniety');
          window.__setKey(k, true);
        }
        function pusc() {
          btn.classList.remove('wcisniety');
          window.__setKey(k, false);
        }
        btn.addEventListener('pointerdown', wcisnij);
        btn.addEventListener('pointerup', pusc);
        btn.addEventListener('pointercancel', pusc);
        btn.addEventListener('lostpointercapture', pusc);
        btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      });
    })();
  </script>
</body>
</html>
